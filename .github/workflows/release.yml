name: Release

# A tag like v1.0.0 builds and checks Link, then attaches the zipped Link.exe folder to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Link.sln
      - run: dotnet build Link.sln --configuration Release --no-restore
      - run: dotnet run --project tests/Link.Desktop.Tests --configuration Release --no-build
      - name: Zip and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Link-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path src/Link.Desktop/bin/Release/net10.0-windows/* -DestinationPath $zip
          gh release create "${{ github.ref_name }}" $zip --title "Link ${{ github.ref_name }}" --generate-notes
