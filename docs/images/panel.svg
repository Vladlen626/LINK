<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" width="440" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3340"/>
      <stop offset="1" stop-color="#141920"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="440" height="720" rx="18" fill="url(#desk)"/>

  <g filter="url(#shadow)">
    <rect x="30" y="20" width="310" height="680" rx="16" fill="#1B2027" fill-opacity="0.96" stroke="#FFFFFF" stroke-opacity="0.15"/>
  </g>

  <!-- header -->
  <text x="47" y="49" font-size="14" font-weight="600" fill="#F5843F">My game</text>
  <path d="M318 39 l8 8 M326 39 l-8 8" stroke="#F2F5F8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- current task -->
  <text x="44" y="82" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#BAC5D0">CURRENT TASK</text>
  <rect x="42" y="90" width="286" height="32" rx="9" fill="#000000" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="54" y="110.5" font-size="12.5" fill="#F2F5F8">Fix the camera jitter</text>

  <!-- project state -->
  <text x="44" y="146" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#BAC5D0">PROJECT STATE</text>
  <text x="326" y="146" font-size="10.5" fill="#BAC5D0" text-anchor="end">updated 30 Sep 2026</text>
  <rect x="42" y="154" width="286" height="66" rx="9" fill="#000000" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text font-size="12" fill="#F2F5F8">
    <tspan x="54" y="174">Цель: демо уровня к пятнице.</tspan>
    <tspan x="54" y="191">Решено: камера — Cinemachine,</tspan>
    <tspan x="54" y="208">персонаж — Rigidbody с интерполяцией.</tspan>
  </text>

  <!-- chat -->
  <text x="44" y="244" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#BAC5D0">CHAT</text>
  <rect x="42" y="252" width="286" height="30" rx="9" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="56" cy="267" r="4" fill="#3FB950"/>
  <text x="67" y="271.5" font-size="12.5" fill="#F2F5F8">My game · camera and controls</text>
  <rect x="42" y="288" width="140" height="28" rx="9" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="84" y="306.5" font-size="12" fill="#F2F5F8">New chat ▾</text>
  <rect x="188" y="288" width="140" height="28" rx="9" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="228" y="306.5" font-size="12" fill="#F2F5F8">Open chat</text>

  <!-- workspace -->
  <text x="44" y="342" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#BAC5D0">WORKSPACE</text>
  <rect x="48" y="354" width="16" height="12" rx="2" fill="none" stroke="#F2F5F8" stroke-width="1.4"/>
  <path d="M48 357 h6 l2 -3 h8" fill="none" stroke="#F2F5F8" stroke-width="1.4"/>
  <text x="72" y="365" font-size="12.5" fill="#F2F5F8">my-game</text>
  <path d="M232 356 l6 6 M238 356 l-6 6" stroke="#F2F5F8" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="248" y="347" width="80" height="26" rx="9" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="267" y="364.5" font-size="12" fill="#F2F5F8">Choose…</text>

  <text x="44" y="397" font-size="11.5" fill="#BAC5D0">docs/map.md · 30 Sep</text>
  <rect x="228" y="380" width="100" height="26" rx="9" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="246" y="397.5" font-size="12" fill="#F2F5F8">Update map</text>

  <rect x="36" y="412" width="298" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="44" y="430" font-size="12" font-weight="600" fill="#F2F5F8">browser-check</text>
  <text x="44" y="448" font-size="11.5" fill="#BAC5D0">Проверить игру в headless Edge: движение, кадр</text>
  <rect x="36" y="462" width="298" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="44" y="480" font-size="12" font-weight="600" fill="#F2F5F8">export-fbx</text>
  <text x="44" y="498" font-size="11.5" fill="#BAC5D0">Экспорт персонажа из Blender в FBX для игры</text>

  <rect x="42" y="516" width="286" height="30" rx="9" fill="#000000" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="54" y="535.5" font-size="12" font-family="Consolas, monospace" fill="#F2F5F8">dotnet build &amp;&amp; dotnet test</text>

  <!-- history -->
  <text x="44" y="572" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#BAC5D0">HISTORY</text>
  <rect x="36" y="580" width="298" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="44" y="598" font-size="12" font-weight="600" fill="#F2F5F8">Почему камера дёргается при беге?</text>
  <text x="326" y="598" font-size="11" fill="#BAC5D0" text-anchor="end">18:42</text>
  <text x="44" y="617" font-size="11.5" fill="#BAC5D0">Камера следует за персонажем в Update, а…</text>
  <rect x="36" y="636" width="298" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="44" y="654" font-size="12" font-weight="600" fill="#F2F5F8">Как назвать анимации бега?</text>
  <text x="326" y="654" font-size="11" fill="#BAC5D0" text-anchor="end">17:10</text>
  <text x="44" y="673" font-size="11.5" fill="#BAC5D0">Коротко и по действию: Hero_Run, Hero_Idle…</text>

  <!-- callouts -->
  <g font-size="12.5" font-weight="700" text-anchor="middle" fill="#1B1B1B">
    <line x1="340" y1="106" x2="366" y2="106" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="378" cy="106" r="12" fill="#FF9F4A"/><text x="378" y="110.5">1</text>
    <line x1="340" y1="187" x2="366" y2="187" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="378" cy="187" r="12" fill="#FF9F4A"/><text x="378" y="191.5">2</text>
    <line x1="340" y1="284" x2="366" y2="284" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="378" cy="284" r="12" fill="#FF9F4A"/><text x="378" y="288.5">3</text>
    <line x1="340" y1="360" x2="366" y2="360" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="378" cy="360" r="12" fill="#FF9F4A"/><text x="378" y="364.5">4</text>
    <line x1="340" y1="393" x2="366" y2="393" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="378" cy="393" r="12" fill="#FF9F4A"/><text x="378" y="397.5">5</text>
    <line x1="340" y1="460" x2="366" y2="460" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="378" cy="460" r="12" fill="#FF9F4A"/><text x="378" y="464.5">6</text>
    <line x1="340" y1="531" x2="366" y2="531" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="378" cy="531" r="12" fill="#FF9F4A"/><text x="378" y="535.5">7</text>
    <line x1="340" y1="633" x2="366" y2="633" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="378" cy="633" r="12" fill="#FF9F4A"/><text x="378" y="637.5">8</text>
  </g>
</svg>
