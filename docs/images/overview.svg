  <text x="44" y="198" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#BAC5D0">WORKSPACE</text>
  <rect x="48" y="210" width="16" height="12" rx="2" fill="none" stroke="#F2F5F8" stroke-width="1.4"/>
  <path d="M48 213 h6 l2 -3 h8" fill="none" stroke="#F2F5F8" stroke-width="1.4"/>
  <text x="72" y="221" font-size="12.5" fill="#F2F5F8">my-game</text>
  <path d="M232 212 l6 6 M238 212 l-6 6" stroke="#F2F5F8" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="248" y="203" width="80" height="26" rx="9" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="267" y="220.5" font-size="12" fill="#F2F5F8">Choose…</text>

  <text x="44" y="253" font-size="11.5" fill="#BAC5D0">docs/map.md · 30 Oct</text>
  <rect x="228" y="236" width="100" height="26" rx="9" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="246" y="253.5" font-size="12" fill="#F2F5F8">Update map</text>

  <rect x="36" y="272" width="298" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.05"/>
