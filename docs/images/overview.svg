  <text x="44" y="88" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#BAC5D0">PROJECT NOTE</text>
  <rect x="42" y="96" width="286" height="72" rx="9" fill="#000000" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text font-size="12" fill="#F2F5F8">
    <tspan x="54" y="116" font-weight="600">Fix the camera jitter</tspan>
    <tspan x="54" y="134">Goal: a level demo by Friday.</tspan>
    <tspan x="54" y="152">Hero: Rigidbody, camera: Cinemachine.</tspan>
  </text>

