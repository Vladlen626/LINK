  <rect x="229" y="289" width="102" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="243" y="297" width="12" height="15" rx="2" fill="none" stroke="#F2F5F8" stroke-width="1.5"/>
  <rect x="246" y="295" width="6" height="4" rx="1" fill="#1B2027" stroke="#F2F5F8" stroke-width="1.3"/>
  <text x="261" y="309" font-size="12" fill="#F2F5F8">Clipboard</text>

  <!-- context chips -->
  <rect x="122" y="328" width="108" height="24" rx="8" fill="#D95E0E" fill-opacity="0.24"/>
