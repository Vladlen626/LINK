  <circle cx="330" cy="286" r="20" fill="#F5843F" fill-opacity="0.9"/>
  <path d="M236 170 l50 26 l-10 18 l-50 -26 z" fill="#8b95a3"/><circle cx="232" cy="176" r="10" fill="#8b95a3"/>
  <text x="200" y="80" font-size="11.5" fill="#9aa4b1">Camera · Perspective</text>

