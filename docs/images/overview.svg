  <rect x="300" y="559" width="38" height="17" rx="4" fill="none" stroke="#BAC5D0" stroke-opacity="0.6"/>
  <text x="306" y="571.5" font-size="10.5" fill="#BAC5D0">Enter</text>
  <text x="344" y="571.5" font-size="11" fill="#BAC5D0">sends to ChatGPT</text>
