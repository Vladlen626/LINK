  <rect x="36" y="322" width="298" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="44" y="340" font-size="12" font-weight="600" fill="#F2F5F8">export-fbx</text>
  <text x="44" y="358" font-size="11.5" fill="#BAC5D0">Export the hero from Blender to FBX</text>

  <rect x="42" y="380" width="286" height="30" rx="9" fill="#000000" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="54" y="399.5" font-size="12" font-family="Consolas, monospace" fill="#F2F5F8">dotnet build &amp;&amp; dotnet test</text>
  <text x="44" y="434" font-size="11" fill="#BAC5D0">runs after an agent's edits</text>
  </g>

  <!-- Link: the card -->
  <g transform="translate(653 46.8) scale(0.66)">
  <g filter="url(#shadow)">
    <rect x="110" y="20" width="340" height="564" rx="16" fill="#1B2027" fill-opacity="0.96" stroke="#FFFFFF" stroke-opacity="0.15"/>
