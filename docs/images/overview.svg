    <rect x="54" y="114" width="90" height="7" rx="3"/><rect x="54" y="130" width="70" height="7" rx="3"/><rect x="44" y="146" width="100" height="7" rx="3"/>
    <rect x="34" y="170" width="80" height="7" rx="3"/><rect x="44" y="186" width="96" height="7" rx="3"/>
