  <text x="258" y="248" font-size="12" fill="#F2F5F8">Blender · window</text>
  <text x="258" y="265" font-size="11" fill="#BAC5D0">a fresh frame on send</text>

  <!-- voice and clipboard -->
  <rect x="122" y="289" width="102" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
