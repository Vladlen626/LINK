  <text x="216" y="344.5" font-size="11" fill="#BAC5D0">×</text>
  <rect x="234" y="328" width="132" height="24" rx="8" fill="#D95E0E" fill-opacity="0.24"/>
  <text x="244" y="344.5" font-size="12" fill="#F2F5F8">Clipboard · 12 lines</text>

  <!-- response -->
  <rect x="122" y="360" width="316" height="190" rx="12" fill="#121619" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <circle cx="137" cy="377" r="4" fill="#3FB950"/>
  <text x="147" y="381" font-size="12" fill="#BAC5D0">Done · 6.1 s</text>
  <rect x="330" y="366" width="50" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="341" y="381.5" font-size="11.5" fill="#F2F5F8">Listen</text>
  <rect x="384" y="366" width="46" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="395" y="381.5" font-size="11.5" fill="#F2F5F8">Copy</text>
  <text font-size="12.5" fill="#F2F5F8">
    <tspan x="134" y="408">The camera follows the hero in Update,</tspan>
    <tspan x="134" y="426">but physics moves him in FixedUpdate:</tspan>
    <tspan x="134" y="444">between physics steps he jumps.</tspan>
    <tspan x="134" y="470">1. Move the follow to LateUpdate.</tspan>
    <tspan x="134" y="488">2. Turn on Rigidbody interpolation.</tspan>
  </text>
  <line x1="134" y1="505" x2="426" y2="505" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="132" y="514" width="96" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="142" y="530.5" font-size="11.5" fill="#F2F5F8">↻ Ask again ▾</text>
  <rect x="234" y="514" width="98" height="24" rx="8" fill="#D95E0E" fill-opacity="0.24"/>
  <text x="244" y="530.5" font-size="11.5" fill="#FFB066">→ Agent task</text>

  <!-- status -->
