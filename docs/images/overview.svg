  <rect x="131" y="211" width="80" height="6" rx="2" fill="#5b6778"/>
  <rect x="131" y="221" width="24" height="52" rx="2" fill="#4a5462"/>
  <rect x="159" y="221" width="84" height="52" rx="2" fill="#303845"/>
  <circle cx="200" cy="247" r="12" fill="#D95E0E" fill-opacity="0.7"/>
