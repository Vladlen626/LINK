  <rect x="252" y="171" width="68" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="261" y="187.5" font-size="12" fill="#F2F5F8">Normal ▾</text>
  <rect x="324" y="171" width="108" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="336" cy="183" r="3.5" fill="none" stroke="#BAC5D0" stroke-width="1.3"/>
  <text x="345" y="187.5" font-size="12" fill="#BAC5D0">Conversation</text>

