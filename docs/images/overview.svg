    <line x1="182" y1="400" x2="956" y2="400"/><line x1="182" y1="430" x2="956" y2="430"/><line x1="182" y1="470" x2="956" y2="470"/><line x1="182" y1="520" x2="956" y2="520"/>
    <line x1="420" y1="380" x2="330" y2="536"/><line x1="500" y1="380" x2="470" y2="536"/><line x1="580" y1="380" x2="610" y2="536"/><line x1="660" y1="380" x2="750" y2="536"/>
