    <tspan x="64" y="411">the agent is told so: dotnet build &amp;&amp; dotnet test.</tspan>
    <tspan x="64" y="428">While it fails, the agent gets its output,</tspan>
    <tspan x="64" y="445">2 times at most.</tspan>
  </text>
