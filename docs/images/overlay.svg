<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 604" width="560" height="604" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3340"/>
      <stop offset="1" stop-color="#141920"/>
    </linearGradient>
    <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4452"/>
      <stop offset="1" stop-color="#262d36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="560" height="604" rx="18" fill="url(#desk)"/>

  <!-- card -->
  <g filter="url(#shadow)">
    <rect x="110" y="20" width="340" height="564" rx="16" fill="#1B2027" fill-opacity="0.96" stroke="#FFFFFF" stroke-opacity="0.15"/>
  </g>

  <!-- header -->
  <rect x="123" y="34" width="18" height="18" rx="5" fill="#F5843F"/>
  <rect x="127.5" y="40" width="3" height="5" rx="1" fill="#2B1810"/>
  <rect x="133.5" y="40" width="3" height="5" rx="1" fill="#2B1810"/>
  <text x="147" y="48" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#F2F5F8">LINK</text>
  <circle cx="194" cy="44" r="4" fill="#3FB950"/>
  <text x="204" y="48" font-size="13" fill="#F2F5F8">My game</text>
  <text x="262" y="48" font-size="10" fill="#BAC5D0">▾</text>
  <rect x="392" y="35" width="16" height="16" rx="3" fill="none" stroke="#F2F5F8" stroke-width="1.4"/>
  <line x1="402" y1="35" x2="402" y2="51" stroke="#F2F5F8" stroke-width="1.4"/>
  <line x1="420" y1="43.5" x2="432" y2="43.5" stroke="#F2F5F8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- task chip -->
  <rect x="122" y="68" width="170" height="26" rx="8" fill="#FFFFFF" fill-opacity="0.10"/>
  <circle cx="135" cy="81" r="4.5" fill="none" stroke="#FF9F4A" stroke-width="1.5"/>
  <text x="146" y="85.5" font-size="12" fill="#F2F5F8">Fix the camera jitter</text>

  <!-- prompt -->
  <rect x="122" y="100" width="316" height="64" rx="12" fill="#000000" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="134" y="124" font-size="13" fill="#F2F5F8">Почему камера дёргается при беге?</text>
  <circle cx="417" cy="143" r="14" fill="#D95E0E"/>
  <path d="M417 150 V137 M411 142 L417 136 L423 142" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- route, level, conversation -->
  <rect x="122" y="171" width="58" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="131" y="187.5" font-size="12" fill="#F2F5F8">Chat ▾</text>
  <rect x="184" y="171" width="68" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="193" y="187.5" font-size="12" fill="#F2F5F8">Normal ▾</text>
  <rect x="256" y="171" width="108" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="268" cy="183" r="3.5" fill="none" stroke="#BAC5D0" stroke-width="1.3"/>
  <text x="277" y="187.5" font-size="12" fill="#BAC5D0">Conversation</text>

  <!-- context actions -->
  <rect x="122" y="202" width="102" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="136" y="212" width="14" height="10" rx="2" fill="none" stroke="#F2F5F8" stroke-width="1.5"/>
  <line x1="140" y1="225.5" x2="146" y2="225.5" stroke="#F2F5F8" stroke-width="1.5"/>
  <text x="156" y="222" font-size="12" fill="#F2F5F8">Screen</text>
  <circle cx="211" cy="211" r="3" fill="#FF9F4A"/>
  <rect x="229" y="202" width="102" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="246" y="210" width="7" height="11" rx="3.5" fill="none" stroke="#F2F5F8" stroke-width="1.5"/>
  <path d="M243 218 a6.5 6.5 0 0 0 13 0 M249.5 224.5 v3" fill="none" stroke="#F2F5F8" stroke-width="1.5" stroke-linecap="round"/>
  <text x="263" y="222" font-size="12" fill="#F2F5F8">Voice</text>
  <rect x="336" y="202" width="102" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="350" y="210" width="12" height="15" rx="2" fill="none" stroke="#F2F5F8" stroke-width="1.5"/>
  <rect x="353" y="208" width="6" height="4" rx="1" fill="#1B2027" stroke="#F2F5F8" stroke-width="1.3"/>
  <text x="368" y="222" font-size="12" fill="#F2F5F8">Clipboard</text>

  <!-- screenshot preview -->
  <rect x="122" y="241" width="316" height="80" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="127" y="246" width="120" height="70" rx="6" fill="url(#shot)"/>
  <rect x="131" y="250" width="80" height="6" rx="2" fill="#5b6778"/>
  <rect x="131" y="260" width="24" height="52" rx="2" fill="#4a5462"/>
  <rect x="159" y="260" width="84" height="52" rx="2" fill="#303845"/>
  <circle cx="200" cy="286" r="12" fill="#D95E0E" fill-opacity="0.7"/>
  <rect x="190" y="292" width="20" height="10" rx="3" fill="#FF9F4A" fill-opacity="0.6"/>
  <text x="258" y="270" font-size="12" fill="#F2F5F8">Active window</text>
  <text x="258" y="287" font-size="11.5" fill="#BAC5D0">Blender · 1920×1080</text>
  <text x="258" y="304" font-size="11" fill="#BAC5D0">goes with the question</text>

  <!-- context chips -->
  <rect x="122" y="328" width="112" height="24" rx="8" fill="#D95E0E" fill-opacity="0.24"/>
  <text x="132" y="344.5" font-size="12" fill="#F2F5F8">Project state</text>
  <text x="220" y="344.5" font-size="11" fill="#BAC5D0">×</text>
  <rect x="238" y="328" width="132" height="24" rx="8" fill="#D95E0E" fill-opacity="0.24"/>
  <text x="248" y="344.5" font-size="12" fill="#F2F5F8">Clipboard · 12 lines</text>

  <!-- response -->
  <rect x="122" y="360" width="316" height="190" rx="12" fill="#121619" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <circle cx="137" cy="377" r="4" fill="#3FB950"/>
  <text x="147" y="381" font-size="12" fill="#BAC5D0">Done · 6.1 s</text>
  <rect x="330" y="366" width="50" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="341" y="381.5" font-size="11.5" fill="#F2F5F8">Listen</text>
  <rect x="384" y="366" width="46" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="395" y="381.5" font-size="11.5" fill="#F2F5F8">Copy</text>
  <text font-size="12.5" fill="#F2F5F8">
    <tspan x="134" y="408">Камера следует за персонажем в Update,</tspan>
    <tspan x="134" y="426">а физика двигает его в FixedUpdate: между</tspan>
    <tspan x="134" y="444">кадрами физики позиция «прыгает».</tspan>
    <tspan x="134" y="470">1. Перенесите следование в LateUpdate.</tspan>
    <tspan x="134" y="488">2. Включите интерполяцию у Rigidbody.</tspan>
  </text>
  <line x1="134" y1="505" x2="426" y2="505" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text y="526" font-size="11.5" fill="#FFB066"><tspan x="134">↻ Deeper</tspan><tspan x="194">↻ Direct</tspan><tspan x="249">↻ Fresh screen</tspan><tspan x="336">↻ Agent</tspan><tspan x="390">✎ Edit</tspan></text>

  <!-- status -->
  <text x="125" y="571" font-size="11.5" fill="#BAC5D0">Ready</text>
  <rect x="352" y="559" width="38" height="17" rx="4" fill="none" stroke="#BAC5D0" stroke-opacity="0.6"/>
  <text x="358" y="571.5" font-size="10.5" fill="#BAC5D0">Enter</text>
  <text x="396" y="571.5" font-size="11" fill="#BAC5D0">to send</text>

  <!-- callouts -->
  <g font-size="12.5" font-weight="700" text-anchor="middle" fill="#1B1B1B">
    <line x1="86" y1="44" x2="110" y2="44" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="74" cy="44" r="12" fill="#FF9F4A"/><text x="74" y="48.5">1</text>
    <line x1="474" y1="43" x2="438" y2="43" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="486" cy="43" r="12" fill="#FF9F4A"/><text x="486" y="47.5">2</text>
    <line x1="86" y1="81" x2="122" y2="81" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="74" cy="81" r="12" fill="#FF9F4A"/><text x="74" y="85.5">3</text>
    <line x1="474" y1="132" x2="438" y2="132" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="486" cy="132" r="12" fill="#FF9F4A"/><text x="486" y="136.5">4</text>
    <line x1="86" y1="183" x2="122" y2="183" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="74" cy="183" r="12" fill="#FF9F4A"/><text x="74" y="187.5">5</text>
    <line x1="474" y1="218" x2="438" y2="218" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="486" cy="218" r="12" fill="#FF9F4A"/><text x="486" y="222.5">6</text>
    <line x1="86" y1="300" x2="122" y2="300" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="74" cy="300" r="12" fill="#FF9F4A"/><text x="74" y="304.5">7</text>
    <line x1="474" y1="377" x2="438" y2="377" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="486" cy="377" r="12" fill="#FF9F4A"/><text x="486" y="381.5">8</text>
    <line x1="474" y1="522" x2="438" y2="522" stroke="#FF9F4A" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="486" cy="522" r="12" fill="#FF9F4A"/><text x="486" y="526.5">9</text>
  </g>
</svg>
